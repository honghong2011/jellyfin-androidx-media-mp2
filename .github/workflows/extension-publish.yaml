name: ExoPlayer FFmpeg Extension Publish

on:
  push:
    tags:
      - v*
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    environment: release
    if: ${{ !startsWith(github.ref, 'refs/pull/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          unzip -q commandlinetools-linux-8512546_latest.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;21.4.7075529" "cmake;3.10.2.4988404"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Build ffmpeg
        run: ./build.sh

      - name: Force specific version of cmake
        run: |
          cmake=(${ANDROID_SDK_ROOT}/cmake/3.10.2*)
          echo cmake.dir="${cmake[0]}" | tee -a local.properties

      # 【关键】打印关键文件，看看到底哪里有问题
      - name: Debug build files
        run: |
          echo "=== 1. exoplayer-ffmpeg-extension/build.gradle.kts ==="
          cat exoplayer-ffmpeg-extension/build.gradle.kts || echo "FILE NOT FOUND"
          echo ""
          echo "=== 2. ExoPlayer 子模块是否存在 ==="
          ls -la ExoPlayer/ | head -10 || echo "ExoPlayer DIR NOT FOUND"
          echo ""
          echo "=== 3. ExoPlayer/core_settings.gradle ==="
          cat ExoPlayer/core_settings.gradle 2>/dev/null || echo "core_settings.gradle NOT FOUND"
          echo ""
          echo "=== 4. ExoPlayer/extensions/ffmpeg/build.gradle ==="
          cat ExoPlayer/extensions/ffmpeg/build.gradle 2>/dev/null || echo "ffmpeg build.gradle NOT FOUND"

      - name: Set JELLYFIN_VERSION
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: echo "JELLYFIN_VERSION=$(echo ${GITHUB_REF#refs/tags/v} | tr / -)" >> $GITHUB_ENV

      # 【加 --stacktrace 显示完整错误】
      - name: Build extension only (no publish)
        run: ./gradlew :exoplayer-ffmpeg-extension:assembleRelease --stacktrace
        env:
          OSSRH_USERNAME: dummy
          OSSRH_PASSWORD: dummy

      - name: Upload compiled AAR package
        uses: actions/upload-artifact@v4
        with:
          name: exoplayer-ffmpeg-extension-aar
          path: exoplayer-ffmpeg-extension/build/outputs/aar/*.aar
